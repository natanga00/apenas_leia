<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Uma declaração especial</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Deseja saber uma coisa?</h1>
    <div class="botoes">
      <button id="sim">Sim</button>
      <button id="nao">Clique aqui primeiro pra se divertir: Não</button>
    </div>
    <div class="mensagem" id="mensagem"></div>
  </div>

  <audio id="musica" loop>
    <source src="Gabriel Elias - Desde que te vi.mp3" type="audio/mpeg">
  </audio>

  <script>
    const botaoSim = document.getElementById("sim");
    const botaoNao = document.getElementById("nao");
    const mensagem = document.getElementById("mensagem");
    const musica = document.getElementById("musica");

    // CONFIGURAÇÃO DO TRECHO DA MÚSICA (em segundos)
    const tempoInicio = 1; // Tempo que a música vai começar
    const tempoFim = 157;    // Tempo que a música vai parar (se não pausarem antes)
    let monitorandoMusica = false;

    botaoSim.addEventListener("click", () => {
      botaoSim.style.display = "none";
      botaoNao.style.display = "none";

      // Insere o NOVO BOTÃO de dar play, o texto e as fotos
      mensagem.innerHTML = `
        <button id="controleMusica" class="btn-musica">🎵 Tocar a Música</button>

        <p>SEI QUE SOMOS APENAS AMIGOS, MAS EU GOSTARIA QUE SOUBESSE DE UMA COISA </p>

      <p> Já faz um tempo que você não sai do meu pensamento. 
          No silêncio do meu quarto, eu escuto a sua voz, 
          e esse seu jeito único me conquistou por completo.
      </p>

      <p> 
        Eu sei que você já sofreu muito, que está cansada de se envolver e se machucar com promessas vazias 
        de quem prometeu o mundo e só trouxe decepção. Sei que errar faz parte do jogo da vida, 
        mas, comigo, o final dessa história vai ser diferente. Hoje não vai ser assim.
      </p>

      <p>
        Deixa o medo de lado e vem comigo. Eu conheço um lugar que pode ser só nosso, onde podemos ver a lua e as estrelas lá fora. 
        Eu te prometo, aqui e agora, que vou cuidar de você, te dar o meu melhor a cada pôr do sol e te proteger de tudo. 
        Eu passei a vida inteira procurando alguém como você e, se depender de mim, 
        eu vou te fazer esquecer o passado e te devolver, do jeito mais lindo, aquelas noites sem dormir.
      </p>

      <p> E é você, sim é você<br>
          O fim de todo desalinho<br>
          O florescer do meu caminho<br>
          É você, sim é você<br>
          O fim de toda despedida
      </p>

        <div class="galeria"> 
          <img src="WhatsApp Image 2026-06-14 at 12.43.45.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="WhatsApp Image 2026-06-15 at 18.35.45.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="WhatsApp Image 2026-06-15 at 21.42.31.jpeg" class="foto-amor">
          <img src="WhatsApp Image 2026-06-15 at 21.42.32.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="WhatsApp Image 2026-06-15 at 21.42.34.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="WhatsApp Image 2026-06-15 at 21.42.37.jpeg" alt="Foto do casal" class="foto-amor">
        </div>
      `;

      // Cria o evento do novo botão que acabou de ser gerado na tela
      const btnMusica = document.getElementById("controleMusica");

      btnMusica.addEventListener("click", () => {
        if (musica.paused) {
          // Se for a primeira vez que dá play, define o tempo inicial do trecho
          if (musica.currentTime < tempoInicio || musica.currentTime >= tempoFim) {
            musica.currentTime = tempoInicio;
          }
          
          musica.play();
          btnMusica.innerText = "⏸️ Pausar Música";

          // Ativa o monitoramento do fim do trecho (apenas uma vez)
          if (!monitorandoMusica) {
            musica.addEventListener("timeupdate", function pararNoTrecho() {
              if (musica.currentTime >= tempoFim) {
                musica.pause();
                btnMusica.innerText = "🎵 Escutar Música";
                musica.removeEventListener("timeupdate", pararNoTrecho);
                monitorandoMusica = false;
              }
            });
            monitorandoMusica = true;
          }
        } else {
          // Se já estiver tocando, o botão pausa a música
          musica.pause();
          btnMusica.innerText = "🎵 Escutar Música";
        }
      });
    });

    // Lógica do botão "Não" fugir
    botaoNao.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      botaoNao.style.position = "absolute";
      botaoNao.style.left = x + "px";
      botaoNao.style.top = y + "px";
    });
  </script>
</body>
</html>
