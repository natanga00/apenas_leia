<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Uma declaração especial</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Deseja saber uma coisa?</h1>
    <div class="botoes">
      <button id="sim">Sim</button>
      <button id="nao">Clique aqui primeiro pra se divertir: Não</button>
    </div>
    <div class="mensagem" id="mensagem"></div>
  </div>

  <audio id="musica" loop>
    <source src="Gabriel Elias - Desde que te vi.mp3" type="audio/mpeg">
  </audio>

  <script>
    const botaoSim = document.getElementById("sim");
    const botaoNao = document.getElementById("nao");
    const mensagem = document.getElementById("mensagem");
    const musica = document.getElementById("musica");

    // CONFIGURAÇÃO DO TRECHO DA MÚSICA (em segundos)
    const tempoInicio = 1; // Tempo que a música vai começar
    const tempoFim = 157;    // Tempo que a música vai parar (se não pausarem antes)
    let monitorandoMusica = false;

    botaoSim.addEventListener("click", () => {
      botaoSim.style.display = "none";
      botaoNao.style.display = "none";

      // Insere o NOVO BOTÃO de dar play, o texto e as fotos
      mensagem.innerHTML = `
        <button id="controleMusica" class="btn-musica">🎵 Tocar a Música</button>

        <p>NÃO SOMOS MAIS APENAS AMIGOS, AGORA VOCÊ É A MINHA NAMORADA E QUERO QUE SAIBA QUE </p>

      <p>
        Desde que você entrou na minha vida, tudo ganhou um sentido mais bonito.
        Você se tornou meu pensamento favorito, meu sorriso mais sincero e aquela presença
        que faz qualquer dia parecer especial.
      </p>

      <p>
        Hoje, não somos apenas amigos: somos namorados, parceiros e dois corações que decidiram
        caminhar na mesma direção.
      </p>

      <p>
        Não quero te prometer um amor perfeito, porque sei que o verdadeiro amor é construído nos
        detalhes, nas conversas, nos cuidados e na escolha diária de permanecer. Mas posso te prometer
        sinceridade, carinho, paciência e vontade de fazer dar certo.
      </p>

      <p>
        Quero viver nossos melhores momentos ao seu lado: admirar a lua e as estrelas, dividir sonhos,
        rir das pequenas coisas e criar memórias que sejam só nossas. Sou muito feliz por ter você na
        minha vida e quero continuar escrevendo essa história com você, todos os dias.
      </p>

      <p> E é você, sim é você<br>
          O fim de todo desalinho<br>
          O florescer do meu caminho<br>
          É você, sim é você<br>
          O fim de toda despedida<br><br>
          
          É você quem eu escolhi e escolho!!
      </p>

        <div class="galeria"> 
          <img src="WhatsApp Image 2026-06-14 at 12.43.45.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="WhatsApp Image 2026-06-15 at 18.35.45.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="WhatsApp Image 2026-06-15 at 21.42.31.jpeg" class="foto-amor">
          <img src="WhatsApp Image 2026-06-15 at 21.42.32.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="WhatsApp Image 2026-06-15 at 21.42.34.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="WhatsApp Image 2026-06-15 at 21.42.37.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="baby - 1.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="baby - 2.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="baby - 3.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="baby - 4 .jpeg" alt="Foto do casal" class="foto-amor">
          <img src="baby - 5.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="baby - 6.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="baby - 7.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="baby - 8.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="baby - 9.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="baby - 10.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós - 2.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós - 3.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós - 4.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós - 5.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós - 6.jpeg" alt="Foto do casal" class="foto-amor">
          <video autoplay muted loop playsinline> <source src="nós - 7.mp4" type="video/mp4" class="meu-video"> </video>
          <img src="nó - 8.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós - 9.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós - 10.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós - 11.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós - 12.jpeg" alt="Foto do casal" class="foto-amor">
          <img src="nós - 13.jpeg" alt="Foto do casal" class="foto-amor">
        </div>
      `;

      // Cria o evento do novo botão que acabou de ser gerado na tela
      const btnMusica = document.getElementById("controleMusica");

      btnMusica.addEventListener("click", () => {
        if (musica.paused) {
          // Se for a primeira vez que dá play, define o tempo inicial do trecho
          if (musica.currentTime < tempoInicio || musica.currentTime >= tempoFim) {
            musica.currentTime = tempoInicio;
          }
          
          musica.play();
          btnMusica.innerText = "⏸️ Pausar Música";

          // Ativa o monitoramento do fim do trecho (apenas uma vez)
          if (!monitorandoMusica) {
            musica.addEventListener("timeupdate", function pararNoTrecho() {
              if (musica.currentTime >= tempoFim) {
                musica.pause();
                btnMusica.innerText = "🎵 Escutar Música";
                musica.removeEventListener("timeupdate", pararNoTrecho);
                monitorandoMusica = false;
              }
            });
            monitorandoMusica = true;
          }
        } else {
          // Se já estiver tocando, o botão pausa a música
          musica.pause();
          btnMusica.innerText = "🎵 Escutar Música";
        }
      });
    });

    // Lógica do botão "Não" fugir
    botaoNao.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      botaoNao.style.position = "absolute";
      botaoNao.style.left = x + "px";
      botaoNao.style.top = y + "px";
    });
  </script>
</body>
</html>
